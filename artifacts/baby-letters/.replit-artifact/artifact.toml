kind = "web"
previewPath = "/"
title = "Baby Letters"
version = "1.0.0"
id = "artifacts/baby-letters"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25467

[services.development]
run = "pnpm --filter @workspace/baby-letters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/baby-letters", "run", "build" ]
publicDir = "artifacts/baby-letters/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25467"
BASE_PATH = "/"
